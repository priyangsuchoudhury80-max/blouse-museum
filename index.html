<title>Blouse Museum</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#fff7f2;
  color:#333;
}

header{
  background:linear-gradient(135deg,#8e2450,#d85b86);
  color:white;
  text-align:center;
  padding:40px 15px;
}

header h1{
  font-size:40px;
  margin-bottom:10px;
}

header p{
  font-size:18px;
}

.contact{
  text-align:center;
  background:white;
  padding:20px;
}

.contact a{
  display:inline-block;
  background:#8e2450;
  color:white;
  text-decoration:none;
  padding:13px 25px;
  border-radius:30px;
  font-size:18px;
}

.title{
  text-align:center;
  color:#8e2450;
  margin:30px 0 20px;
  font-size:28px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.card img{
  width:100%;
  height:270px;
  object-fit:cover;
}

.card h3{
  text-align:center;
  padding:15px;
  color:#8e2450;
}

footer{
  margin-top:30px;
  background:#8e2450;
  color:white;
  text-align:center;
  padding:25px;
}
</style>
</head>
